[package]
name = "headway"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
axum = {  version = "0.8.9", default-features = false, features=["tokio", "http1"] }
bytes = "1.11.1"
log = "0.4.29"
#pmtiles = {  version = "0.18.0", default-features = false, features = ["mmap-async-tokio", "http-async", "extract"] }
pmtiles = {  git = "https://github.com/michaelkirk/pmtiles-rs", branch = "mkirk/extract-stream", version = "0.20.0", default-features = false, features = ["mmap-async-tokio", "http-async",  "extract"] }
#pmtiles = {  path = "../../../../../pmtiles/pmtiles-rs", version = "0.18.0", default-features = false, features = ["mmap-async-tokio", "extract", "http-async"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }
thiserror = "2.0.17"
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "io-util"] }
uniffi = { workspace = true, features = ["tokio"] }
uuid = { version = "1.23.1", features = ["v4"], default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
env_logger = "0.11"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
